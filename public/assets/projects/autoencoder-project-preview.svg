<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgML" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B1325" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="accentML" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cardML" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111D35" />
      <stop offset="100%" stop-color="#0A1222" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgML)" />

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#09101E" />
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#1E293B" stroke-width="1" />
  <rect x="56" y="21" width="28" height="28" rx="7" fill="url(#accentML)" />
  <text x="98" y="40" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">AUTOENCODER BOTTLENECK ANALYSIS // FASHION-MNIST</text>
  <rect x="935" y="19" width="210" height="32" rx="16" fill="#13223E" stroke="#06B6D4" stroke-opacity="0.4" />
  <text x="1040" y="39" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-weight="600" font-size="12" text-anchor="middle">TensorFlow &amp; Keras</text>

  <!-- Left Architecture Visualization Card: Encoder -> Bottleneck -> Decoder -->
  <rect x="56" y="106" width="680" height="410" rx="16" fill="url(#cardML)" stroke="#1E3A5F" stroke-width="1.5" />
  <text x="88" y="146" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="16">Neural Network Architecture: Latent Space Compression</text>
  <text x="88" y="170" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Input (28x28 = 784) &rarr; Dense Encoder Layers &rarr; Bottleneck Representation (z) &rarr; Reconstruction</text>

  <!-- Network Connection Lines -->
  <g stroke="#2563EB" stroke-opacity="0.32" stroke-width="1.2">
    <!-- Input to Hidden 1 -->
    <line x1="140" y1="220" x2="260" y2="245" />
    <line x1="140" y1="220" x2="260" y2="305" />
    <line x1="140" y1="275" x2="260" y2="245" />
    <line x1="140" y1="275" x2="260" y2="365" />
    <line x1="140" y1="330" x2="260" y2="305" />
    <line x1="140" y1="385" x2="260" y2="365" />
    <line x1="140" y1="440" x2="260" y2="415" />
    <line x1="140" y1="440" x2="260" y2="365" />
    <!-- Hidden 1 to Bottleneck -->
    <line x1="260" y1="245" x2="395" y2="300" stroke="#06B6D4" stroke-opacity="0.55" />
    <line x1="260" y1="305" x2="395" y2="300" stroke="#06B6D4" stroke-opacity="0.55" />
    <line x1="260" y1="305" x2="395" y2="360" stroke="#06B6D4" stroke-opacity="0.55" />
    <line x1="260" y1="365" x2="395" y2="360" stroke="#06B6D4" stroke-opacity="0.55" />
    <line x1="260" y1="415" x2="395" y2="360" stroke="#06B6D4" stroke-opacity="0.55" />
    <!-- Bottleneck to Decoder Hidden -->
    <line x1="395" y1="300" x2="530" y2="245" stroke="#06B6D4" stroke-opacity="0.55" />
    <line x1="395" y1="300" x2="530" y2="305" stroke="#06B6D4" stroke-opacity="0.55" />
    <line x1="395" y1="360" x2="530" y2="365" stroke="#06B6D4" stroke-opacity="0.55" />
    <line x1="395" y1="360" x2="530" y2="415" stroke="#06B6D4" stroke-opacity="0.55" />
    <!-- Decoder to Output -->
    <line x1="530" y1="245" x2="650" y2="220" />
    <line x1="530" y1="305" x2="650" y2="275" />
    <line x1="530" y1="305" x2="650" y2="330" />
    <line x1="530" y1="365" x2="650" y2="385" />
    <line x1="530" y1="415" x2="650" y2="440" />
  </g>

  <!-- Input Layer Nodes -->
  <g fill="#1E3A8A" stroke="#3B82F6" stroke-width="2">
    <circle cx="140" cy="220" r="13" />
    <circle cx="140" cy="275" r="13" />
    <circle cx="140" cy="330" r="13" />
    <circle cx="140" cy="385" r="13" />
    <circle cx="140" cy="440" r="13" />
  </g>
  <text x="140" y="482" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Input (784)</text>

  <!-- Encoder Layer Nodes -->
  <g fill="#1E293B" stroke="#60A5FA" stroke-width="2">
    <circle cx="260" cy="245" r="13" />
    <circle cx="260" cy="305" r="13" />
    <circle cx="260" cy="365" r="13" />
    <circle cx="260" cy="415" r="13" />
  </g>
  <text x="260" y="482" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Encoder</text>

  <!-- Bottleneck Layer Highlight Box -->
  <rect x="360" y="255" width="70" height="150" rx="14" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-dasharray="4 4" />
  <circle cx="395" cy="300" r="15" fill="#06B6D4" />
  <circle cx="395" cy="360" r="15" fill="#06B6D4" />
  <text x="395" y="482" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-weight="600" font-size="11" text-anchor="middle">Bottleneck (z)</text>

  <!-- Decoder Layer Nodes -->
  <g fill="#1E293B" stroke="#60A5FA" stroke-width="2">
    <circle cx="530" cy="245" r="13" />
    <circle cx="530" cy="305" r="13" />
    <circle cx="530" cy="365" r="13" />
    <circle cx="530" cy="415" r="13" />
  </g>
  <text x="530" y="482" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Decoder</text>

  <!-- Reconstructed Output Nodes -->
  <g fill="#1E3A8A" stroke="#3B82F6" stroke-width="2">
    <circle cx="650" cy="220" r="13" />
    <circle cx="650" cy="275" r="13" />
    <circle cx="650" cy="330" r="13" />
    <circle cx="650" cy="385" r="13" />
    <circle cx="650" cy="440" r="13" />
  </g>
  <text x="650" y="482" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Output (784)</text>

  <!-- Right Panel: Experiment & Reconstruction Overview -->
  <rect x="764" y="106" width="380" height="410" rx="16" fill="url(#cardML)" stroke="#1E293B" stroke-width="1.5" />
  <text x="796" y="146" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="16">Bottleneck Dimension Analysis</text>
  <text x="796" y="170" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Comparing latent sizes on Fashion-MNIST</text>

  <!-- Loss Curve Visualization -->
  <rect x="796" y="196" width="316" height="165" rx="12" fill="#070B14" stroke="#1E293B" />
  <path d="M 816 330 Q 860 230, 920 220 T 1090 208" fill="none" stroke="url(#accentML)" stroke-width="3" />
  <circle cx="845" cy="280" r="4" fill="#3B82F6" />
  <circle cx="920" cy="220" r="5" fill="#06B6D4" />
  <circle cx="1040" cy="211" r="4" fill="#22D3EE" />
  <text x="816" y="348" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="10">Latent Dim (z) vs Reconstruction Fidelity</text>

  <!-- Stack Badges inside Right Panel -->
  <rect x="796" y="382" width="150" height="46" rx="10" fill="#0B1325" stroke="#1E293B" />
  <text x="871" y="410" fill="#60A5FA" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">Python + Keras</text>

  <rect x="962" y="382" width="150" height="46" rx="10" fill="#0B1325" stroke="#1E293B" />
  <text x="1037" y="410" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">Fashion-MNIST</text>

  <rect x="796" y="442" width="316" height="46" rx="10" fill="#0B1325" stroke="#1E293B" />
  <text x="954" y="470" fill="#E2E8F0" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">Feature Compression &amp; Reconstruction</text>

  <!-- Bottom Summary Strip -->
  <rect x="56" y="544" width="1088" height="150" rx="16" fill="url(#cardML)" stroke="#1E293B" />
  <text x="88" y="588" fill="#06B6D4" font-family="JetBrains Mono, monospace" font-weight="600" font-size="12">ACADEMIC MACHINE LEARNING PROJECT // B.TECH CSE (AI &amp; ML)</text>
  <text x="88" y="622" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="20">Studying Information Retention Across Autoencoder Bottleneck Layers</text>
  <text x="88" y="654" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">Evaluating how varying latent vector dimensions affect image reconstruction quality and feature extraction on Fashion-MNIST.</text>
</svg>
