<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgApp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0B1324" />
    </linearGradient>
    <linearGradient id="accentApp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgApp)" />

  <!-- Sidebar Navigation -->
  <rect x="0" y="0" width="240" height="750" fill="#09101D" />
  <line x1="240" y1="0" x2="240" y2="750" stroke="#1E293B" stroke-width="1" />

  <rect x="28" y="28" width="28" height="28" rx="7" fill="url(#accentApp)" />
  <text x="68" y="47" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="15">EDTECH WORKSPACE</text>

  <!-- Sidebar Links -->
  <rect x="20" y="92" width="200" height="40" rx="10" fill="#13223E" stroke="#2563EB" stroke-opacity="0.4" />
  <text x="52" y="117" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="13">Learning Modules</text>

  <text x="52" y="167" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Interactive Labs</text>
  <text x="52" y="212" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Resource Library</text>
  <text x="52" y="257" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Assessment Tracker</text>
  <text x="52" y="302" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">System Settings</text>

  <!-- Top Bar -->
  <rect x="241" y="0" width="959" height="72" fill="#0A1220" />
  <line x1="241" y1="72" x2="1200" y2="72" stroke="#1E293B" stroke-width="1" />
  <text x="280" y="42" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="17">Interactive Curriculum &amp; Web Application Suite</text>
  <rect x="960" y="20" width="196" height="32" rx="8" fill="#132038" stroke="#334155" />
  <text x="1058" y="40" fill="#38BDF8" font-family="Inter, sans-serif" font-weight="500" font-size="12" text-anchor="middle">Modular Web Architecture</text>

  <!-- Main Workspace Grid -->
  <!-- Banner Card -->
  <rect x="280" y="104" width="876" height="156" rx="16" fill="#0F1B31" stroke="#1E3A5F" />
  <text x="316" y="148" fill="#38BDF8" font-family="Inter, sans-serif" font-weight="600" font-size="12" letter-spacing="0.8">CUSTOM WEB APPLICATION INTERFACE</text>
  <text x="316" y="184" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="26">Structured Digital Learning &amp; Workflow Portal</text>
  <text x="316" y="218" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">Built with reusable React components, responsive state management, and clean dark UI tokens.</text>

  <!-- 3 Module Cards -->
  <rect x="280" y="288" width="276" height="210" rx="16" fill="#0D1628" stroke="#1E293B" />
  <rect x="308" y="316" width="90" height="24" rx="12" fill="#2563EB" fill-opacity="0.2" />
  <text x="353" y="332" fill="#60A5FA" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">MODULE 01</text>
  <text x="308" y="372" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="16">Interactive Courseware</text>
  <text x="308" y="400" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Structured study paths with</text>
  <text x="308" y="420" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">topic filtering and search.</text>
  <rect x="308" y="454" width="220" height="8" rx="4" fill="#1E293B" />
  <rect x="308" y="454" width="165" height="8" rx="4" fill="url(#accentApp)" />

  <rect x="580" y="288" width="276" height="210" rx="16" fill="#0D1628" stroke="#1E293B" />
  <rect x="608" y="316" width="90" height="24" rx="12" fill="#06B6D4" fill-opacity="0.2" />
  <text x="653" y="332" fill="#22D3EE" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">MODULE 02</text>
  <text x="608" y="372" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="16">Live Resource Hub</text>
  <text x="608" y="400" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Organized documentation,</text>
  <text x="608" y="420" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">notes and media playback.</text>
  <rect x="608" y="454" width="220" height="8" rx="4" fill="#1E293B" />
  <rect x="608" y="454" width="190" height="8" rx="4" fill="#06B6D4" />

  <rect x="880" y="288" width="276" height="210" rx="16" fill="#0D1628" stroke="#1E293B" />
  <rect x="908" y="316" width="90" height="24" rx="12" fill="#3B82F6" fill-opacity="0.2" />
  <text x="953" y="332" fill="#60A5FA" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">MODULE 03</text>
  <text x="908" y="372" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="16">Analytics &amp; Feedback</text>
  <text x="908" y="400" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Real-time progress panels</text>
  <text x="908" y="420" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">and milestone overviews.</text>
  <rect x="908" y="454" width="220" height="8" rx="4" fill="#1E293B" />
  <rect x="908" y="454" width="145" height="8" rx="4" fill="#3B82F6" />

  <!-- Bottom Code / Architecture Strip -->
  <rect x="280" y="526" width="876" height="176" rx="16" fill="#0D1628" stroke="#1E293B" />
  <text x="312" y="566" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="600" font-size="15">Component System &amp; API Architecture</text>
  <text x="312" y="594" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Engineered with TypeScript, modular hooks, and responsive layout primitives for rapid extensibility.</text>
  <rect x="312" y="618" width="120" height="32" rx="8" fill="#13223E" />
  <text x="372" y="639" fill="#60A5FA" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">React + TS</text>
  <rect x="446" y="618" width="120" height="32" rx="8" fill="#13223E" />
  <text x="506" y="639" fill="#22D3EE" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Tailwind UI</text>
  <rect x="580" y="618" width="140" height="32" rx="8" fill="#13223E" />
  <text x="650" y="639" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Responsive Grid</text>
</svg>
