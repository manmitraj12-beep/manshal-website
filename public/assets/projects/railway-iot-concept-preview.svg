<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIoT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="55%" stop-color="#0B1426" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="accentIoT" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgIoT)" />

  <!-- Top Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#09101E" />
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#1E293B" stroke-width="1" />
  <rect x="56" y="21" width="28" height="28" rx="7" fill="url(#accentIoT)" />
  <text x="98" y="40" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">SMART RAILWAY LINEN THEFT ALERT // IOT ARCHITECTURE CONCEPT</text>
  <rect x="935" y="19" width="210" height="32" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.5" />
  <text x="1040" y="39" fill="#FBBF24" font-family="JetBrains Mono, monospace" font-weight="600" font-size="11" text-anchor="middle">CONCEPT &amp; PROTOTYPE DESIGN</text>

  <!-- 3-Stage IoT Pipeline Diagram -->
  <!-- Stage 1: RFID Tagged Linen Inventory -->
  <rect x="56" y="120" width="330" height="360" rx="16" fill="#0E182C" stroke="#1E3A5F" stroke-width="1.5" />
  <rect x="84" y="148" width="96" height="24" rx="12" fill="#2563EB" fill-opacity="0.2" />
  <text x="132" y="164" fill="#60A5FA" font-family="JetBrains Mono, monospace" font-weight="600" font-size="11" text-anchor="middle">STAGE 01</text>
  <text x="84" y="206" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="19">RFID Linen Tagging</text>
  <text x="84" y="236" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Passive UHF RFID tags embedded</text>
  <text x="84" y="256" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">in coach bedsheets, pillows and</text>
  <text x="84" y="276" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">blankets for unique item identity.</text>

  <rect x="84" y="310" width="274" height="136" rx="12" fill="#070B14" stroke="#1E293B" />
  <circle cx="134" cy="378" r="24" fill="#2563EB" fill-opacity="0.2" stroke="#3B82F6" />
  <circle cx="134" cy="378" r="8" fill="#06B6D4" />
  <text x="176" y="370" fill="#FFFFFF" font-family="JetBrains Mono, monospace" font-size="12">UID: #RL-8842-A</text>
  <text x="176" y="392" fill="#64748B" font-family="JetBrains Mono, monospace" font-size="11">Coach B4 // Inventory</text>

  <!-- Connector Arrow 1 -> 2 -->
  <line x1="386" y1="300" x2="434" y2="300" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Stage 2: Coach Exit Reader & Edge Controller -->
  <rect x="434" y="120" width="330" height="360" rx="16" fill="#0E182C" stroke="#06B6D4" stroke-opacity="0.6" stroke-width="1.5" />
  <rect x="462" y="148" width="96" height="24" rx="12" fill="#06B6D4" fill-opacity="0.2" />
  <text x="510" y="164" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-weight="600" font-size="11" text-anchor="middle">STAGE 02</text>
  <text x="462" y="206" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="19">Doorway RFID Scanner</text>
  <text x="462" y="236" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Checkpoint readers placed near</text>
  <text x="462" y="256" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">coach exits detect unauthorized</text>
  <text x="462" y="276" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">movement outside scheduled stations.</text>

  <rect x="462" y="310" width="274" height="136" rx="12" fill="#070B14" stroke="#1E293B" />
  <text x="486" y="352" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-size="12">&gt; Scanning Checkpoint...</text>
  <text x="486" y="378" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">&gt; Auth Handover: FALSE</text>
  <text x="486" y="404" fill="#FBBF24" font-family="JetBrains Mono, monospace" font-size="11">&gt; Triggering Alert Signal</text>

  <!-- Connector Arrow 2 -> 3 -->
  <line x1="764" y1="300" x2="812" y2="300" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Stage 3: Attendant Alert & Tracking Concept -->
  <rect x="812" y="120" width="332" height="360" rx="16" fill="#0E182C" stroke="#1E3A5F" stroke-width="1.5" />
  <rect x="840" y="148" width="96" height="24" rx="12" fill="#2563EB" fill-opacity="0.2" />
  <text x="888" y="164" fill="#60A5FA" font-family="JetBrains Mono, monospace" font-weight="600" font-size="11" text-anchor="middle">STAGE 03</text>
  <text x="840" y="206" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="19">Instant Alert Mechanism</text>
  <text x="840" y="236" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Notifies coach attendants and</text>
  <text x="840" y="256" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">logs missing inventory counts</text>
  <text x="840" y="276" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">for automated reconciliation.</text>

  <rect x="840" y="310" width="276" height="136" rx="12" fill="#070B14" stroke="#1E293B" />
  <rect x="864" y="336" width="228" height="40" rx="8" fill="#1E293B" />
  <text x="978" y="361" fill="#38BDF8" font-family="Inter, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Attendant Notification</text>
  <text x="978" y="410" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Inventory Audit Log</text>

  <!-- Bottom Concept Banner -->
  <rect x="56" y="520" width="1088" height="170" rx="16" fill="#0E182C" stroke="#1E293B" />
  <text x="88" y="564" fill="#FBBF24" font-family="JetBrains Mono, monospace" font-weight="600" font-size="12">TECHNICAL / IOT PROJECT CONCEPT</text>
  <text x="88" y="600" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="20">RFID-Based Railway Linen Tracking &amp; Theft Prevention System</text>
  <text x="88" y="634" fill="#94A3B8" font-family="Inter, sans-serif" font-size="14">An exploratory IoT system architecture designed to reduce linen loss in passenger coaches through automated RFID exit detection.</text>
</svg>
